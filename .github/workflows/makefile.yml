name: Build Theos Tweak
on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Set up Theos Environment
run: |
sudo apt-get update
sudo apt-get install -y build-essential git wget ldid libssl-dev pkg-config
# Cài đặt Theos vào thư mục /opt/theos
git clone --recursive https://github.com/theos/theos.git /opt/theos
# Cài đặt iOS SDKs (ví dụ: iPhoneOS14.5.sdk hoặc mới hơn tương thích)
sudo mkdir -p /opt/theos/sdks
git clone https://github.com/leminswug/iPhoneOS-SDKs.git /tmp/sdks
sudo cp -r /tmp/sdks/*.sdk /opt/theos/sdks/ || true
# Cấu hình biến môi trường THEOS
echo "THEOS=/opt/theos" >> $GITHUB_ENV
echo "/opt/theos/bin" >> $GITHUB_PATH
- name: Build Package with Make
run: |
make package FINALPACKAGE=1
- name: Upload Build Artifacts
uses: actions/upload-artifact@v4
with:
name: LienQuanVNMod-Deb
path: packages/*.deb
